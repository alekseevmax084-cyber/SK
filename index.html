const paths={home:'M3 10 12 3l9 7v10H3z M9 20v-7h6v7',tasks:'M9 5h11v15H4V5h3 M9 3h6v4H9z M8 12l2 2 5-5',building:'M4 21V7l8-4 8 4v14 M8 9h1m6 0h1 M8 13h1m6 0h1 M8 17h1m6 0h1 M2 21h20',clock:'M12 8v5l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',users:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3 M13 3a4 4 0 0 1 0 8 M22 21v-3a4 4 0 0 0-3-3 M12 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',wallet:'M3 6h16v15H3V4h14 M15 12h7v5h-7z M18 14.5h.1',file:'M14 2H5v20h14V7z M14 2v6h5 M8 13h8 M8 17h6',plus:'M12 5v14 M5 12h14',arrow:'M5 12h14 M15 8l4 4-4 4',down:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4',calendar:'M4 5h16v16H4z M16 3v4 M8 3v4 M4 10h16',search:'M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',check:'M5 12l4 4L19 6',close:'M6 6l12 12 M6 18 18 6',left:'M15 5l-7 7 7 7',right:'M9 5l7 7-7 7',clip:'M8 13l7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L13 2',edit:'M4 20l4-1L20 7l-4-4L4 15z'};
const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(paths[n]||paths.file)+'"/></svg>';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLocal=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10),TODAY=dateLocal(new Date()),monthNow=TODAY.slice(0,7),money=x=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(x),pretty=d=>d?new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'Без срока';
let data={tasks:[],workers:[],shifts:[],projects:[]},loaded=false,connection='loading',view=location.hash.slice(1)||'overview',tab='Все задачи',query='',selectedMonth=monthNow,selectedDate=TODAY,calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const D=()=>data,find=(kind,id)=>D()[kind].find(x=>x.id===id),proj=id=>find('projects',id)?.name||'Без объекта',worker=id=>find('workers',id)?.name||'Рабочий удалён',initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join(''),hours=s=>{if(s.reason==='Отсутствие')return 0;let mins=t=>Number(t.split(':')[0])*60+Number(t.split(':')[1]),n=mins(s.end)-mins(s.start);if(n<0)n+=1440;return Math.max(0,(n-Number(s.break||0))/60)},sum=a=>a.reduce((n,s)=>n+hours(s),0),badge=s=>'<span class="badge '+(s==='Выполнено'?'green':s==='В работе'?'orange':s==='Предписание'?'red':'grey')+'">'+esc(s)+'</span>';
function toast(t){$('#toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toast').innerHTML='',3500)}
async function req(path,method='GET',body){return SKCloud.request(path,method,body)}
let connectionMessage='',openedProjectId=null,taskLayout='list',massStatusBusy=false;const selectedTaskIds=new Set(),statusSavingIds=new Set();try{taskLayout=localStorage.getItem('sk-elit-task-layout')==='table'?'table':'list'}catch{}
async function load(){connection='loading';render();try{await SKCloud.ready();const r=await Promise.all(Object.keys(data).map(async k=>[k,await req(k)]));data=Object.fromEntries(r);loaded=true;connection='ready';$('#sync').textContent='Данные синхронизированы';render()}catch(e){connection=e.code==='ACCESS'?'access':e.code==='CONFIG'?'config':'error';connectionMessage=e.message;$('#sync').textContent=connection==='access'?'Откройте личную ссылку':connection==='config'?'Ожидает подключения базы':'Нет соединения';render()}}
let syncing=false;
async function syncQuietly(){if(!loaded||connection!=='ready'||syncing||massStatusBusy||statusSavingIds.size||document.visibilityState!=='visible'||$('#modal').innerHTML)return;syncing=true;try{const r=await Promise.all(Object.keys(data).map(async k=>[k,await req(k)]));data=Object.fromEntries(r);$('#sync').textContent='Данные синхронизированы';render()}catch(e){if(e.code==='ACCESS'){loaded=false;connection='access';render()}else $('#sync').textContent='Нет соединения · изменения не отправляются'}finally{syncing=false}}
setInterval(syncQuietly,20000);document.addEventListener('visibilitychange',syncQuietly);

function personalAccessView(){return '<section class="panel connect-panel"><div class="panel-head"><h2>Ваши данные</h2></div><form onsubmit="connectPersonalLink(event)" style="padding:24px"><p style="margin-bottom:18px">Откройте сохранённую личную ссылку или вставьте её здесь один раз.</p><label>Личная ссылка<input name="link" type="url" required placeholder="https://…/SK/#key=…" autocomplete="off" autocapitalize="none" spellcheck="false"></label><p id="accessError" role="alert" style="color:#be141d;margin-top:12px"></p><button class="btn primary" style="margin-top:18px" type="submit">Открыть мои данные</button></form></section>'}
async function connectPersonalLink(e){e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;try{await SKCloud.connectLink(new FormData(e.target).get('link'));await load()}catch(error){$('#accessError').textContent=error.message}finally{b.disabled=false}}
function showPersonalLink(){try{const link=SKCloud.personalLink();openModal('Личная ссылка','<div class="detail"><p>Откройте её на другом устройстве, чтобы видеть те же данные. Ссылка даёт доступ к записям — передавайте её только себе.</p><input id="personalLink" aria-label="Личная ссылка" readonly style="width:100%;margin-top:16px" value="'+esc(link)+'" onclick="this.select()"><footer><button class="btn primary" onclick="copyPersonalLink()">Скопировать</button></footer></div>')}catch(e){toast(e.message)}}
async function copyPersonalLink(){try{await navigator.clipboard.writeText(SKCloud.personalLink());toast('Ссылка скопирована')}catch{const input=$('#personalLink');input.focus();input.select();toast('Скопируйте выделенную ссылку')}}
function go(v){view=v;location.hash=v;query='';$('#search').value='';render()}
const navs=[['overview','home','Обзор'],['projects','building','Объекты'],['tasks','tasks','Задачи'],['timesheet','clock','Табель'],['workers','users','Рабочие'],['payroll','wallet','Бухгалтерия']];
$('#logo').innerHTML=icon('building');$('#searchIcon').innerHTML=icon('search');$('#today').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
$('#search').oninput=e=>{query=e.target.value.toLowerCase();if(query&&view==='overview')view='tasks';render()};window.onhashchange=()=>{const next=location.hash.slice(1)||'overview';if(next!==view){view=next;query='';$('#search').value='';render()}};
function btn(text,action,kind='',ic='plus'){return '<button class="btn '+kind+'" onclick="'+action+'">'+icon(ic)+text+'</button>'}
function heading(title,sub,actions){return '<div class="heading"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="toolbar">'+actions+'</div></div>'}
function render(){document.body.classList.toggle('connection-screen',connection!=='ready');if(connection!=='ready'){$('#nav').innerHTML='';$('#app').innerHTML=connection==='loading'?'<div class="empty" role="status">Загрузка данных…</div>':connection==='access'?personalAccessView():connection==='config'?'<section class="panel connect-panel"><div class="empty">Общая база ещё не подключена.<br>После подключения здесь откроются ваши данные.<br>Записи в этом режиме не создаются.</div></section>':'<section class="panel connect-panel"><div class="empty" role="alert">'+esc(connectionMessage)+'<div style="margin-top:18px">'+btn('Повторить загрузку','load()','primary','arrow')+'</div></div></section>';return}if(!navs.some(n=>n[0]===view))view='overview';$('#nav').innerHTML=navs.map(([id,ic,label])=>'<button class="'+(view===id?'active':'')+'" onclick="go(\''+id+'\')">'+icon(ic)+label+(id==='tasks'?'<span class="num">'+D().tasks.filter(t=>t.status!=='Выполнено').length+'</span>':'')+'</button>').join('');$('#crumb').textContent=navs.find(n=>n[0]===view)[2];let html='';html+=({overview:overview,projects:projectsView,tasks:tasksView,timesheet:timesheetView,workers:workersView,payroll:payrollView}[view])();$('#app').innerHTML=html;if(openedProjectId&&find('projects',openedProjectId))projectDetail(openedProjectId)}
function taskPeriod(task){const start=task.startDate||task.date||task.endDate||'',end=task.endDate||task.date||task.startDate||'';return {start,end}}
function taskOnDate(task,date){const period=taskPeriod(task);return !!period.start&&!!date&&period.start<=date&&period.end>=date}
function taskPeriodLabel(task){const {start,end}=taskPeriod(task);if(!start)return 'Без периода';const showYear=start.slice(0,4)!==end.slice(0,4)||start.slice(0,4)!==TODAY.slice(0,4),format=date=>new Date(date+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',...(showYear?{year:'numeric'}:{})});return start===end?format(start):format(start)+' — '+format(end)}
function stats(){let d=D(),today=d.shifts.filter(s=>s.date===TODAY),monthly=d.shifts.filter(s=>s.date.startsWith(monthNow)),active=d.tasks.filter(t=>t.status!=='Выполнено');return '<div class="stats">'+[['building','Объекты',d.projects.length,'В журнале объектов'],['tasks','Открытые задачи',active.length,'<b>'+d.tasks.filter(t=>taskOnDate(t,TODAY)&&t.status!=='Выполнено').length+' на сегодня</b>'],['users','Рабочие сегодня',new Set(today.filter(s=>hours(s)>0).map(s=>s.worker)).size,'Отмечены в табеле'],['clock','Часы за месяц',money(sum(monthly))+' <small>ч</small>','<b>'+money(sum(today))+' ч</b> за сегодня']].map(([ic,label,val,foot],i)=>'<div class="stat '+(i===2?'highlight':'')+'"><div class="stat-label">'+icon(ic)+label+'</div><strong>'+val+'</strong><div class="stat-foot">'+foot+'</div></div>').join('')+'</div>'}
function taskRows(tasks){return tasks.length?tasks.map(t=>'<div class="task" onclick="detailTask(\''+t.id+'\')"><button aria-label="Отметить выполнение" class="check '+(t.status==='Выполнено'?'done':'')+'" onclick="event.stopPropagation();toggleTask(\''+t.id+'\')">'+(t.status==='Выполнено'?icon('check'):'')+'</button><div class="task-info"><div class="task-title" style="'+(t.status==='Выполнено'?'color:#838383;text-decoration:line-through':'')+'">'+esc(t.title)+'</div><div class="task-meta"><span>'+icon('building')+esc(proj(t.project))+'</span><span>'+icon('calendar')+taskPeriodLabel(t)+'</span><span>'+esc(t.type)+'</span>'+'</div></div>'+badge(t.status)+'</div>').join(''):'<div class="empty">Задач пока нет.<br>Добавьте первую задачу и укажите срок.</div>'}
function filteredTasks(){return D().tasks.filter(t=>(tab==='Все задачи'||tab==='На сегодня'&&taskOnDate(t,TODAY)||tab==='Выполнено'&&t.status==='Выполнено')&&(t.title+' '+t.comment).toLowerCase().includes(query))}
function taskPanel(full=false){let d=D();return '<section class="panel"><div class="panel-head"><h2>'+(full?'Задачи и предписания':'Задачи')+'</h2><button class="link" onclick="'+(full?'taskForm()':"go('tasks')")+'">'+(full?'+ Добавить':'Все задачи →')+'</button></div><div class="tabs">'+['Все задачи','На сегодня','Выполнено'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+t+' <span>'+d.tasks.filter(x=>t==='Все задачи'||t==='На сегодня'&&taskOnDate(x,TODAY)||t==='Выполнено'&&x.status==='Выполнено').length+'</span></button>').join('')+'</div>'+taskRows(full?filteredTasks():filteredTasks().slice(0,4))+'</section>'}
function overview(){return heading('Обзор','Задачи и рабочие смены.',btn('Табель',"go('timesheet')",'','clock')+btn('Новая задача','taskForm()','primary'))+stats()+'<div class="grid"><div>'+taskPanel()+crewPanel()+'</div><div class="right-col">'+projectCard(D().projects[0])+calendar()+'</div></div>'}
function projectProgress(id){const tasks=D().tasks.filter(t=>t.project===id),done=tasks.filter(t=>t.status==='Выполнено').length;return {total:tasks.length,done,percent:tasks.length?Math.round(done/tasks.length*100):null}}
function projectCard(p){if(!p)return '<section class="panel project"><div class="eyebrow">ОБЪЕКТЫ</div><h3>Объектов пока нет</h3><p>Добавьте объект, чтобы связать задачи и рабочие смены.</p>'+btn('Добавить объект','projectForm()','','plus')+'</section>';const progress=projectProgress(p.id);return '<section class="panel project"><div class="eyebrow">ОБЪЕКТ В РАБОТЕ ↗</div><h3>'+esc(p.name)+'</h3><p>'+esc(p.address)+'</p><div class="project-line"><span style="width:'+(progress.percent??0)+'%"></span></div><div class="project-details"><span>'+(progress.total?'Закрыто '+progress.done+' из '+progress.total:'Нет задач')+'</span><b>'+(progress.percent===null?'—':progress.percent+'%')+'</b></div>'+btn('Открыть объект',"projectDetail('"+p.id+"')",'','arrow')+'</section>'}

function calendar(){let y=calMonth.getFullYear(),m=calMonth.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<span class="dim">·</span>';for(let i=1;i<=days;i++){let dt=dateLocal(new Date(y,m,i)),marked=D().tasks.some(t=>taskOnDate(t,dt));cells+='<button class="'+(selectedDate===dt?'current':marked?'mark':'')+'" onclick="selectedDate=\''+dt+'\';calendarDay()">'+i+'</button>'}return '<section class="panel"><div class="calendar"><div class="cal-head"><b>'+calMonth.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</b><div><button aria-label="Предыдущий месяц" onclick="calMonth.setMonth(calMonth.getMonth()-1);render()">'+icon('left')+'</button><button aria-label="Следующий месяц" onclick="calMonth.setMonth(calMonth.getMonth()+1);render()">'+icon('right')+'</button></div></div><div class="cal-grid">'+['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(x=>'<span class="weekday">'+x+'</span>').join('')+cells+'</div><div class="calendar-note"><span class="dot"></span> Периоды задач · нажмите на дату</div></div></section>'}
function calendarDay(){render();openModal('План на '+pretty(selectedDate),'<div class="detail">'+taskRows(D().tasks.filter(t=>taskOnDate(t,selectedDate)))+btn('Добавить задачу',"taskForm(null,'"+selectedDate+"')",'primary')+'</div>')}
function crewPanel(){let shifts=D().shifts.filter(s=>s.date===TODAY);return '<section class="panel"><div class="panel-head"><h2>Рабочие сегодня <small>· '+pretty(TODAY)+'</small></h2><button class="link" onclick="go(\'timesheet\')">Открыть табель →</button></div>'+shiftTable(shifts,false)+'<div class="table-foot"><span>'+new Set(shifts.map(s=>s.worker)).size+' рабочих в табеле</span><b>Всего: '+money(sum(shifts))+' ч</b></div></section>'}
function shiftTable(shifts,edit=true){return shifts.length?'<div class="table-wrap"><table><thead><tr><th>Рабочий</th><th>Начало</th><th>Конец</th><th>Часы</th>'+(edit?'<th>Причина / комментарий</th><th></th>':'')+'</tr></thead><tbody>'+shifts.map(s=>'<tr><td><div class="person"><span class="avatar">'+esc(initials(worker(s.worker)))+'</span><div><b>'+esc(worker(s.worker))+'</b><small>'+esc(edit?pretty(s.date):find('workers',s.worker)?.role||'')+'</small></div></div></td><td>'+esc(s.start)+'</td><td>'+esc(s.end)+'</td><td><b>'+money(hours(s))+' ч</b></td>'+(edit?'<td>'+esc(s.reason)+'<div style="font-size:10px;color:#818181;margin-top:5px">'+esc(s.comment)+'</div></td><td><button aria-label="Изменить смену" onclick="shiftForm(\''+s.id+'\')">'+icon('edit')+'</button></td>':'')+'</tr>').join('')+'</tbody></table></div>':'<div class="empty">Смен пока нет. Отметьте начало и конец работы.</div>'}
function tasksView(){return heading('Задачи и работы','Предписания, объёмы и дополнительные работы.',btn('Списком',"openBulk('tasks')",'','plus')+btn('Новая задача','taskForm()','primary'))+'<div class="subhead"><input placeholder="Поиск задач" aria-label="Поиск задач" value="'+esc(query)+'" oninput="filterTasksInput(this.value)"><div class="switch"><button class="'+(taskLayout==='list'?'active':'')+'" onclick="setTaskLayout(&quot;list&quot;)">Список</button><button class="'+(taskLayout==='table'?'active':'')+'" onclick="setTaskLayout(&quot;table&quot;)">Таблица</button></div></div><section class="panel"><div class="panel-head"><h2>Журнал задач</h2><span class="badge grey">'+D().tasks.length+' всего</span></div><div class="tabs">'+['Все задачи','На сегодня','Выполнено'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="setTaskTab(this.textContent)">'+t+'</button>').join('')+'</div><div id="taskResults">'+(taskLayout==='table'?taskTable(filteredTasks()):taskRows(filteredTasks()))+'</div></section>'}

function projectsView(){return heading('Объекты','Список объектов и готовность работ.',btn('Добавить объект','projectForm()','primary'))+'<div class="right-col" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))">'+(D().projects.length?D().projects.map(projectCard).join(''):projectCard())+'</div>'}
function workersView(){let workers=D().workers.filter(w=>(w.name+' '+w.role).toLowerCase().includes(query));return heading('Рабочие','Состав команды и почасовые ставки.',btn('Списком',"openBulk('workers')",'','plus')+btn('Добавить рабочего','workerForm()','primary'))+'<section class="panel"><div class="panel-head"><h2>Список рабочих</h2><small>'+workers.length+' человек</small></div>'+(workers.length?'<div class="table-wrap"><table><thead><tr><th>Рабочий</th><th>Специальность</th><th>Ставка, ₽/ч</th><th></th></tr></thead><tbody>'+workers.map(w=>'<tr><td><div class="person"><span class="avatar">'+esc(initials(w.name))+'</span><b>'+esc(w.name)+'</b></div></td><td>'+esc(w.role)+'</td><td>'+money(w.rate)+'</td><td><button class="link" onclick="workerForm(\''+w.id+'\')">Изменить</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Добавьте рабочих, чтобы вести табель и считать оплату.</div>')+'</section>'}
function timesheetView(){let list=D().shifts.filter(s=>s.date===selectedDate);return heading('Табель рабочего времени','Фиксируйте смены — часы посчитаются автоматически.',btn('Списком',"openBulk('shifts')",'','plus')+btn('Добавить смену','shiftForm()','primary'))+'<div class="subhead"><input type="date" aria-label="Дата табеля" value="'+selectedDate+'" onchange="selectedDate=this.value;render()">'+btn('Сегодня',"selectedDate=TODAY;render()",'','calendar')+'<span style="margin-left:auto;color:#6a6a6a;font-size:12px">'+new Set(list.filter(s=>hours(s)>0).map(s=>s.worker)).size+' рабочих · '+money(sum(list))+' ч</span></div><section class="panel">'+shiftTable(list)+'</section><div class="note">Часы = конец − начало − перерыв. Если конец раньше начала, смена считается ночной. Отсутствие даёт 0 часов, простой и переработка учитываются как рабочее время.</div>'}
function payrollRows(){return D().workers.map(w=>{let s=D().shifts.filter(s=>s.worker===w.id&&s.date.startsWith(selectedMonth));return {w,days:new Set(s.filter(s=>hours(s)>0).map(s=>s.date)).size,h:sum(s),amount:sum(s)*Number(w.rate||0)}})}
function payrollView(){let rows=payrollRows(),total=rows.reduce((s,r)=>s+r.amount,0);return heading('Бухгалтерия','Часы и предварительное начисление по каждому рабочему.',btn('Выгрузить CSV','exportCSV()','primary','down'))+'<div class="subhead"><label>Расчётный месяц<input type="month" value="'+selectedMonth+'" onchange="selectedMonth=this.value;render()"></label></div><div class="stats">'+[['Отработано',money(rows.reduce((s,r)=>s+r.h,0))+' ч'],['Рабочих с часами',rows.filter(r=>r.h>0).length],['К начислению',money(total)+' ₽']].map(([l,v])=>'<div class="stat"><div class="stat-label">'+l+'</div><strong style="font-size:26px">'+v+'</strong></div>').join('')+'</div><section class="panel"><div class="panel-head"><h2>Сводка за месяц</h2><small>'+selectedMonth.split('-').reverse().join('.')+'</small></div><div class="table-wrap"><table><thead><tr><th>Рабочий</th><th>Дней</th><th>Часов</th><th>Ставка, ₽/ч</th><th>Начислено, ₽</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.w.name)+'</td><td>'+r.days+'</td><td>'+money(r.h)+'</td><td>'+money(r.w.rate)+'</td><td><b>'+money(r.amount)+'</b></td></tr>').join('')+'</tbody></table></div><div class="table-foot"><span>Итого к начислению</span><b>'+money(total)+' ₽</b></div></section><div class="note">Предварительный расчёт: часы × текущая ставка рабочего. Без налогов, авансов и удержаний. Изменение ставки пересчитывает сводку. В CSV включены сводка и подробности всех смен с причинами и комментариями.</div>'}
function openModal(title,body){openedProjectId=null;$('#modal').innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header><h2>'+esc(title)+'</h2><button aria-label="Закрыть" onclick="closeModal()">'+icon('close')+'</button></header>'+body+'</section></div>';setTimeout(()=>$('#modal input, #modal select, #modal button')?.focus(),10)}
function closeModal(){if(window.SKBulk?.isBusy()){toast('Дождитесь завершения сохранения');return}openedProjectId=null;$('#modal').innerHTML=''}document.onkeydown=e=>{if(e.key==='Escape')closeModal()};
const field=(l,n,type='text',val='',extra='')=>'<label>'+l+'<input name="'+n+'" type="'+type+'" value="'+esc(val)+'" '+extra+'></label>',select=(l,n,arr,val)=>'<label>'+l+'<select name="'+n+'">'+arr.map(x=>{let a=Array.isArray(x)?x:[x,x];return '<option value="'+esc(a[0])+'" '+(a[0]===val?'selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select></label>',projectsOptions=()=>[['','Без объекта'],...D().projects.map(p=>[p.id,p.name])];
function form(title,kind,fields,id,custom=''){openModal(title,'<form onsubmit="submitForm(event,\''+kind+'\',\''+(id||'')+'\')"><div class="form-grid">'+fields+'</div>'+custom+'<footer>'+(id?'<button type="button" class="btn delete" onclick="deleteRecord(\''+kind+'\',\''+id+'\')">Удалить</button>':'')+'<button type="button" class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" type="submit">Сохранить</button></footer><p id="formError" style="color:#c41620;margin-top:12px" role="alert"></p></form>')}
function taskForm(id,date){let t=find('tasks',id)||{},period=taskPeriod(t),start=period.start||date||TODAY,end=period.end||start;form(id?'Изменить задачу':'Новая задача','tasks','<div class="full">'+field('Что нужно сделать','title','text',t.title,'required maxlength="1000" placeholder="Например, принять армирование"')+'</div>'+select('Объект','project',projectsOptions(),t.project)+select('Тип','type',['Работы','Замечание','Предписание','Допработы'],t.type)+field('Начало периода','startDate','date',start,'onchange="validateTaskPeriod(this.form)"')+field('Окончание периода','endDate','date',end,'onchange="validateTaskPeriod(this.form)"')+select('Статус','status',['К выполнению','В работе','На согласовании','Выполнено'],t.status)+field('Объём','volume','number',t.volume,'min="0" step="0.01"')+select('Единица','unit',['м²','м³','м.п.','шт.','компл.'],t.unit)+'<label class="full">Комментарий<textarea name="comment">'+esc(t.comment)+'</textarea></label>',id);validateTaskPeriod($('#modal form'))}
function validateTaskPeriod(form){const start=form.elements.namedItem('startDate'),end=form.elements.namedItem('endDate');end.min=start.value;end.setCustomValidity(start.value&&end.value&&end.value<start.value?'Дата окончания не может быть раньше начала.':'')}
function workerForm(id){let w=find('workers',id)||{};form(id?'Изменить рабочего':'Добавить рабочего','workers','<div class="full">'+field('Имя и фамилия','name','text',w.name,'required maxlength="100"')+'</div>'+field('Специальность','role','text',w.role,'maxlength="100"')+field('Ставка, ₽ / час','rate','number',w.rate??0,'min="0" max="100000" step="0.01" required'),id)}
function projectForm(id){let p=find('projects',id)||{};form(id?'Изменить объект':'Новый объект','projects','<div class="full">'+field('Название объекта','name','text',p.name,'required maxlength="150"')+'</div><div class="full">'+field('Адрес / корпус','address','text',p.address,'maxlength="200"')+'</div>'+field('Плановая дата сдачи','end','date',p.end),id)}
function shiftForm(id){if(!D().workers.length){toast('Сначала добавьте рабочего');workerForm();return}let s=find('shifts',id)||{};form(id?'Изменить смену':'Добавить смену','shifts',select('Рабочий','worker',D().workers.map(w=>[w.id,w.name]),s.worker)+select('Объект','project',projectsOptions(),s.project)+field('Дата начала смены','date','date',s.date||selectedDate,'required')+select('Причина','reason',['Работа','Переработка','Простой','Отсутствие'],s.reason)+field('Начало','start','time',s.start||'08:00','required')+field('Конец','end','time',s.end||'18:00','required')+field('Перерыв, минут','break','number',s.break??60,'min="0" max="1440" required')+'<div style="align-self:end;font-size:11px;color:#767676;padding:10px 0">Ночные смены поддерживаются</div><label class="full">Комментарий / причина отсутствия<textarea name="comment">'+esc(s.comment)+'</textarea></label>',id)}
async function submitForm(e,kind,id){e.preventDefault();let el=e.target,b=el.querySelector('[type=submit]');b.disabled=true;b.textContent='Сохранение…';try{let fd=new FormData(el),v=Object.fromEntries(fd);if(!loaded)throw Error('Дождитесь загрузки данных.');if(kind==='tasks'){let start=v.startDate||v.endDate||'',end=v.endDate||v.startDate||'';if(start&&end<start)throw Error('Дата окончания не может быть раньше начала.');v.startDate=start;v.endDate=end;v.date=end;}if(kind==='shifts'){let dup=data.shifts.find(s=>s.worker===v.worker&&s.date===v.date&&s.id!==id);if(dup)throw Error('Смена этого рабочего на эту дату уже есть. Измените существующую запись.');if(v.start===v.end&&v.reason!=='Отсутствие')throw Error('Начало и конец совпадают. Проверьте время.');let s={...v};if(v.reason!=='Отсутствие'&&hours(s)<=0)throw Error('Перерыв должен быть короче смены.');}const saved=await req(kind+(id?'/'+id:''),id?'PUT':'POST',v);data[kind]=id?data[kind].map(x=>x.id===id?saved:x):[...data[kind],saved];closeModal();if(kind==='tasks'&&!id){tab='Все задачи';query='';$('#search').value='';go('tasks')}else render();toast('Сохранено')}catch(err){$('#formError').textContent=err.message;b.disabled=false;b.textContent='Сохранить'}}
async function toggleTask(id){let t=find('tasks',id);try{let n={...t,status:t.status==='Выполнено'?'В работе':'Выполнено'};await req('tasks/'+id,'PUT',n);data.tasks=data.tasks.map(x=>x.id===id?n:x);render()}catch(e){toast(e.message)}}
function detailTask(id){let t=find('tasks',id);openModal(t.title,'<div class="detail"><div class="row"><span>'+esc(t.type)+'</span>'+badge(t.status)+'</div><div class="row"><span>Объект</span><b>'+esc(proj(t.project))+'</b></div><div class="row"><span>Период</span><b>'+taskPeriodLabel(t)+'</b></div><div class="row"><span>Объём работ</span><b>'+esc(t.volume||'—')+' '+esc(t.volume?t.unit:'')+'</b></div><h3>Комментарий</h3><p>'+esc(t.comment||'Комментарий не добавлен')+'</p>'+'<footer>'+btn('Изменить',"taskForm('"+id+"')",'primary','edit')+'</footer></div>')}
function projectDetail(id){let p=find('projects',id);const progress=projectProgress(id);openModal(p.name,'<div class="detail"><p>'+esc(p.address)+'</p><div class="row"><span>Задачи и замечания</span><b>'+(progress.total?'Закрыто '+progress.done+' из '+progress.total+' · '+progress.percent+'%':'Нет задач')+'</b></div><div class="row"><span>Плановая сдача</span><b>'+pretty(p.end)+'</b></div><h3>Задачи объекта</h3>'+taskRows(D().tasks.filter(t=>t.project===id))+'<footer>'+btn('Изменить объект',"projectForm('"+id+"')",'primary','edit')+'</footer></div>');openedProjectId=id}

async function deleteRecord(kind,id){if(kind==='workers'&&data.shifts.some(s=>s.worker===id)){toast('У рабочего есть смены. Удаление заблокировано для сохранности табеля.');return}if(kind==='projects'&&[...data.tasks,...data.shifts].some(x=>x.project===id)){toast('У объекта есть связанные записи. Сначала измените их объект.');return}try{await req(kind+'/'+id,'DELETE');data[kind]=data[kind].filter(x=>x.id!==id);closeModal();render();toast('Запись удалена')}catch(e){toast(e.message)}}
function exportCSV(){let rows=[['СК Элит — сводка',selectedMonth,''],['Рабочий','Дней','Часов','Ставка ₽/ч','Начислено ₽'],...payrollRows().map(r=>[r.w.name,r.days,r.h,r.w.rate,r.amount]),[],['Детализация смен'],['Дата','Рабочий','Объект','Начало','Конец','Перерыв мин','Часы','Причина','Комментарий'],...D().shifts.filter(s=>s.date.startsWith(selectedMonth)).map(s=>[s.date,worker(s.worker),proj(s.project),s.start,s.end,s.break,hours(s),s.reason,s.comment])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='СК-Элит-'+selectedMonth+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Сводка выгружена')}

const taskStates=['К выполнению','В работе','На согласовании','Выполнено'];
function openBulk(kind){SKBulk.open(kind,{today:TODAY,date:selectedDate,getData:()=>data,request:req,open:openModal,close:closeModal,toast,onSaved:(kind,records,workers)=>{for(const [collection,items] of [[kind,records],['workers',workers]]){const map=new Map(data[collection].map(x=>[x.id,x]));for(const item of items)map.set(item.id,item);data[collection]=[...map.values()]}},done:(kind,records)=>{if(kind==='tasks'){taskLayout='table';try{localStorage.setItem('sk-elit-task-layout','table')}catch{}tab='Все задачи';query='';selectedTaskIds.clear();go('tasks')}else if(kind==='workers')go('workers');else{if(records.length)selectedDate=records[0].date;go('timesheet')}}})}
function filterTasksInput(value){query=value.toLowerCase();selectedTaskIds.clear();renderTaskResults()}
function setTaskLayout(layout){taskLayout=layout;selectedTaskIds.clear();try{localStorage.setItem('sk-elit-task-layout',layout)}catch{}render()}
function setTaskTab(value){tab=value;selectedTaskIds.clear();render()}
function taskTable(tasks){if(!tasks.length)return '<div class="empty">Задач по этому фильтру нет. Можно добавить одну задачу или вставить список.</div>';const chosen=tasks.filter(t=>selectedTaskIds.has(t.id)).length;return '<div class="task-table-actions"><label class="bulk-check"><input type="checkbox" aria-label="Выбрать все показанные задачи" '+(chosen===tasks.length?'checked':'')+' '+(massStatusBusy?'disabled':'')+' onchange="selectVisibleTasks(this.checked)"> Все показанные</label><span>Выбрано: '+chosen+'</span><select id="massTaskStatus" aria-label="Статус выбранных задач" '+(massStatusBusy?'disabled':'')+'><option value="">Выберите статус</option>'+taskStates.map(x=>'<option>'+x+'</option>').join('')+'</select><button class="btn" '+(!chosen||massStatusBusy?'disabled':'')+' onclick="applyTaskStatus()">'+(massStatusBusy?'Сохранение…':'Применить статус')+'</button></div><div class="table-wrap" id="taskTableScroll"><table class="tasks-table"><thead><tr><th></th><th>Задача</th><th>Статус</th><th>Тип</th><th>Период</th><th>Объект</th></tr></thead><tbody>'+tasks.map(t=>'<tr data-task-id="'+t.id+'"><td><input type="checkbox" aria-label="Выбрать задачу '+esc(t.title)+'" '+(selectedTaskIds.has(t.id)?'checked':'')+' '+(massStatusBusy?'disabled':'')+' onchange="selectTask(this.closest(&quot;tr&quot;).dataset.taskId,this.checked)"></td><td class="task-cell"><button class="task-title-button" onclick="detailTask(this.closest(&quot;tr&quot;).dataset.taskId)">'+esc(t.title)+'</button></td><td><select aria-label="Статус задачи '+esc(t.title)+'" '+(massStatusBusy||statusSavingIds.has(t.id)?'disabled':'')+' onchange="updateTaskStatus(this.closest(&quot;tr&quot;).dataset.taskId,this.value,this)">'+taskStates.map(status=>'<option '+(status===t.status?'selected':'')+'>'+status+'</option>').join('')+'</select></td><td>'+esc(t.type)+'</td><td>'+esc(taskPeriodLabel(t))+'</td><td>'+esc(proj(t.project))+'</td></tr>').join('')+'</tbody></table></div>'}
function renderTaskResults(){const target=$('#taskResults');if(!target)return;const left=$('#taskTableScroll')?.scrollLeft||0;target.innerHTML=taskLayout==='table'?taskTable(filteredTasks()):taskRows(filteredTasks());if($('#taskTableScroll'))$('#taskTableScroll').scrollLeft=left;const counter=$('#nav .num');if(counter)counter.textContent=data.tasks.filter(t=>t.status!=='Выполнено').length}
function selectTask(id,checked){if(massStatusBusy)return;if(checked)selectedTaskIds.add(id);else selectedTaskIds.delete(id);renderTaskResults()}
function selectVisibleTasks(checked){if(massStatusBusy)return;for(const t of filteredTasks())if(checked)selectedTaskIds.add(t.id);else selectedTaskIds.delete(t.id);renderTaskResults()}
async function updateTaskStatus(id,status,control){if(massStatusBusy||statusSavingIds.has(id)||!taskStates.includes(status))return;const original=find('tasks',id);if(!original)return;statusSavingIds.add(id);if(control)control.disabled=true;try{const result=await req('tasks/'+id,'PUT',{...original,status});data.tasks=data.tasks.map(x=>x.id===id?result:x)}catch(error){if(control)control.value=original.status;toast(error.message)}finally{statusSavingIds.delete(id);if(view==='tasks')renderTaskResults();else render()}}
async function applyTaskStatus(){if(massStatusBusy)return;if(statusSavingIds.size){toast('Дождитесь сохранения статуса');return}const status=$('#massTaskStatus')?.value,items=filteredTasks().filter(t=>selectedTaskIds.has(t.id));if(!taskStates.includes(status)){toast('Выберите статус');return}if(!items.length)return;massStatusBusy=true;renderTaskResults();let done=0;try{const results=await SKBulk.pool(items,async t=>{const record=await req('tasks/'+t.id,'PUT',{...t,status});data.tasks=data.tasks.map(x=>x.id===t.id?record:x);selectedTaskIds.delete(t.id);done++;return record});const failures=results.filter(r=>r.error).length;toast('Обновлено: '+done+(failures?' · не сохранилось: '+failures:''))}finally{massStatusBusy=false;if(view==='tasks')renderTaskResults();else render()}}

render();load();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>

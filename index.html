function workerForm(id){let w=find('workers',id)||{};form(id?'Изменить рабочего':'Добавить рабочего','workers','<div class="full">'+field('Имя и фамилия','name','text',w.name,'required maxlength="100"')+'</div>'+field('Специальность','role','text',w.role,'maxlength="100"')+field('Ставка, ₽ / час','rate','number',w.rate??0,'min="0" max="100000" step="0.01" required'),id)}

function shiftForm(id){if(!D().workers.length){toast('Сначала добавьте рабочего');workerForm();return}let s=find('shifts',id)||{};form(id?'Изменить смену':'Добавить смену','shifts',select('Рабочий','worker',D().workers.map(w=>[w.id,w.name]),s.worker)+select('Объект','project',projectsOptions(),s.project)+field('Дата начала смены','date','date',s.date||selectedDate,'required')+select('Причина','reason',['Работа','Переработка','Простой','Отсутствие'],s.reason)+field('Начало','start','time',s.start||'08:00','required')+field('Конец','end','time',s.end||'18:00','required')+field('Перерыв, минут','break','number',s.break??60,'min="0" max="1440" required')+'<div style="align-self:end;font-size:11px;color:#767676;padding:10px 0">Ночные смены поддерживаются</div><label class="full">Комментарий / причина отсутствия<textarea name="comment">'+esc(s.comment)+'</textarea></label>',id)}
function documentForm(){form('Загрузить документ','documents',select('Объект','project',projectsOptions(),'')+'<label class="full">Файл до 15 МБ<input type="file" name="attachments" required></label>')}
async function submitForm(e,kind,id){e.preventDefault();let el=e.target,b=el.querySelector('[type=submit]');b.disabled=true;b.textContent='Сохранение…';try{let fd=new FormData(el),v=Object.fromEntries([...fd].filter(([k])=>k!=='attachments'));if(!loaded)throw Error('Сервер пока недоступен. Обновите страницу.');if(demo){throw Error('Переключитесь на «Мои данные» перед добавлением записей. Демонстрация не изменяется.')}if(kind==='shifts'){let dup=data.shifts.find(s=>s.worker===v.worker&&s.date===v.date&&s.id!==id);if(dup)throw Error('Смена этого рабочего на эту дату уже есть. Измените существующую запись.');if(v.start===v.end&&v.reason!=='Отсутствие')throw Error('Начало и конец совпадают. Проверьте время.');let s={...v};if(v.reason!=='Отсутствие'&&hours(s)<=0)throw Error('Перерыв должен быть короче смены.');}let files=fd.getAll('attachments').filter(f=>f.size);for(const f of files){if(f.size>15*1024*1024)throw Error('Файл '+f.name+' больше 15 МБ')}let attachments=[];for(const f of files){let upload=new FormData();upload.set('file',f);attachments.push(await req('files','POST',upload))}if(kind==='tasks')v.files=[...(find('tasks',id)?.files||[]),...attachments];if(kind==='documents'){if(!attachments.length)throw Error('Выберите файл');v={...v,...attachments[0],fileId:attachments[0].id};}const saved=await req(kind+(id?'/'+id:''),id?'PUT':'POST',v);data[kind]=id?data[kind].map(x=>x.id===id?saved:x):[...data[kind],saved];closeModal();render();toast('Сохранено')}catch(err){$('#formError').textContent=err.message;b.disabled=false;b.textContent='Сохранить'}}
async function toggleTask(id){let t=find('tasks',id);if(demo){t.status=t.status==='Выполнено'?'В работе':'Выполнено';render();toast('Изменено в демонстрации');return}try{let n={...t,status:t.status==='Выполнено'?'В работе':'Выполнено'};await req('tasks/'+id,'PUT',n);data.tasks=data.tasks.map(x=>x.id===id?n:x);render()}catch(e){toast(e.message)}}
function detailTask(id){let t=find('tasks',id);openModal(t.title,'<div class="detail"><div class="row"><span>'+esc(t.type)+'</span>'+badge(t.status)+'</div><div class="row"><span>Объект</span><b>'+esc(proj(t.project))+'</b></div><div class="row"><span>Срок</span><b>'+pretty(t.date)+'</b></div><div class="row"><span>Объём работ</span><b>'+esc(t.volume||'—')+' '+esc(t.volume?t.unit:'')+'</b></div><h3>Комментарий</h3><p>'+esc(t.comment||'Комментарий не добавлен')+'</p>'+(t.files||[]).map(f=>'<div class="file-row"><a href="/api/files/'+f.id+'">'+icon('clip')+' '+esc(f.name)+'</a></div>').join('')+'<footer>'+btn('Изменить',"taskForm('"+id+"')",'primary','edit')+'</footer></div>')}
function projectDetail(id){let p=find('projects',id);openModal(p.name,'<div class="detail"><p>'+esc(p.address)+'</p><div class="row"><span>Готовность</span><b>'+esc(p.progress)+'%</b></div><div class="row"><span>Плановая сдача</span><b>'+pretty(p.end)+'</b></div><h3>Задачи объекта</h3>'+taskRows(D().tasks.filter(t=>t.project===id))+'<footer>'+btn('Изменить объект',"projectForm('"+id+"')",'primary','edit')+'</footer></div>')}
async function deleteRecord(kind,id){if(demo){toast('Это демонстрационный пример');return}if(kind==='workers'&&data.shifts.some(s=>s.worker===id)){toast('У рабочего есть смены. Удаление заблокировано для сохранности табеля.');return}if(kind==='projects'&&[...data.tasks,...data.shifts,...data.documents].some(x=>x.project===id)){toast('У объекта есть связанные записи. Сначала измените их объект.');return}try{await req(kind+'/'+id,'DELETE');data[kind]=data[kind].filter(x=>x.id!==id);closeModal();render();toast('Запись удалена')}catch(e){toast(e.message)}}
function exportCSV(){let rows=[['СК Элит — сводка',selectedMonth,demo?'ДЕМОНСТРАЦИЯ':''],['Рабочий','Дней','Часов','Ставка ₽/ч','Начислено ₽'],...payrollRows().map(r=>[r.w.name,r.days,r.h,r.w.rate,r.amount]),[],['Детализация смен'],['Дата','Рабочий','Объект','Начало','Конец','Перерыв мин','Часы','Причина','Комментарий'],...D().shifts.filter(s=>s.date.startsWith(selectedMonth)).map(s=>[s.date,worker(s.worker),proj(s.project),s.start,s.end,s.break,hours(s),s.reason,s.comment])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='СК-Элит-'+selectedMonth+(demo?'-пример':'')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Сводка выгружена')}
render();load();
</script></body></html>
